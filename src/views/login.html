<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusGlow | Iniciar sesión</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary:#e53935;
            --primary-dark:#c62828;
            --blue:#0b2d4d;
            --muted:#718096;
        }

        * {
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body {
            font-family:Inter,sans-serif;
            background:
                linear-gradient(135deg,#0b2d4d,#164a73);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
        }

        .card {
            background:white;
            width:100%;
            max-width:420px;
            padding:40px;
            border-radius:18px;
            box-shadow:0 20px 50px rgba(0,0,0,.2);
        }

        .logo {
            text-align:center;
            font-size:30px;
            font-weight:800;
            color:var(--blue);
            margin-bottom:30px;
        }

        .logo span {
            color:var(--primary);
        }

        h1 {
            color:var(--blue);
            text-align:center;
            margin-bottom:8px;
        }

        .subtitle {
            text-align:center;
            color:var(--muted);
            font-size:13px;
            margin-bottom:25px;
        }

        .field {
            margin-bottom:18px;
        }

        label {
            display:block;
            color:#475569;
            font-size:12px;
            font-weight:700;
            margin-bottom:7px;
        }

        input {
            width:100%;
            height:50px;
            border:1px solid #e4e8ed;
            border-radius:8px;
            padding:0 14px;
            outline:none;
        }

        input:focus {
            border-color:var(--primary);
        }

        button {
            width:100%;
            height:50px;
            border:0;
            border-radius:8px;
            background:var(--primary);
            color:white;
            font-weight:800;
            cursor:pointer;
        }

        button:hover {
            background:var(--primary-dark);
        }

        .forgot {
            text-align:right;
            margin-bottom:20px;
        }

        .forgot a,
        .register a {
            color:var(--primary);
            text-decoration:none;
            font-size:12px;
            font-weight:700;
        }

        .register {
            text-align:center;
            margin-top:22px;
            color:var(--muted);
            font-size:13px;
        }
    </style>
</head>

<body>

<div class="card">

    <a href="index.html" class="logo" style="display:block;text-decoration:none">
        🚌 Bus<span>Glow</span>
    </a>

    <h1>Bienvenido</h1>

    <p class="subtitle">
        Ingresa a tu cuenta para continuar.
    </p>

    <form onsubmit="login(event)">

        <div class="field">
            <label>CORREO ELECTRÓNICO</label>
            <input type="email" id="email" required>
        </div>

        <div class="field">
            <label>CONTRASEÑA</label>
            <input type="password" id="password" required>
        </div>

        <div class="forgot">
            <a href="#" onclick="BusGlow.toast('Escríbenos a soporte@busglow.pe desde tu correo registrado y te ayudaremos a restablecerla.', 'info', 6000); return false;">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" id="btnLogin">
            Iniciar sesión
        </button>

    </form>

    <div class="register">
        ¿No tienes una cuenta?
        <a href="registro.html" id="linkRegistro">Crear cuenta</a>
    </div>

</div>

<script src="js/api.js"></script>
<script>
const { api, session, toast, params } = BusGlow;
const next = params.get("next");

// Conservar el destino al ir a registrarse
if (next) document.getElementById("linkRegistro").href = "registro.html?next=" + encodeURIComponent(next);

// Destino seguro (solo páginas internas)
function destino(usuario) {
    if (next && /^[a-z]+\.html/i.test(next)) return next;
    return ["ADMIN", "EMPRESA", "VENDEDOR"].includes(usuario.rol) ? "admin.html" : "perfil.html";
}

if (session.token && session.user) location.replace(destino(session.user));

async function login(event) {
    event.preventDefault();
    const btn = document.getElementById("btnLogin");
    btn.disabled = true;
    btn.textContent = "Ingresando...";
    try {
        const r = await api("/auth/login", {
            method: "POST",
            auth: false,
            body: {
                correo: document.getElementById("email").value,
                password: document.getElementById("password").value
            }
        });
        session.set(r.token, r.usuario);
        toast(`¡Bienvenido a BusGlow, ${r.usuario.nombres}!`, "ok");
        setTimeout(() => location.href = destino(r.usuario), 500);
    } catch (err) {
        toast(err.message, "error");
        btn.disabled = false;
        btn.textContent = "Iniciar sesión";
    }
}
</script>

</body>
</html>
