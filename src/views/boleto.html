<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusGlow | Boleto electrónico</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>

    <style>
        :root {
            --primary: #e53935;
            --blue: #0b2d4d;
            --green: #16a085;
            --muted: #718096;
            --border: #e4e8ed;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { font-family: "Inter", sans-serif; background: #f5f7fa; color: #263238; }

        header {
            height: 72px; background: white; display: flex; align-items: center; justify-content: space-between;
            padding: 0 6%; border-bottom: 1px solid #eee;
        }
        .logo { text-decoration: none; color: var(--blue); font-size: 25px; font-weight: 800; }
        .logo span { color: var(--primary); }
        nav { display: flex; gap: 20px; }
        nav a { text-decoration: none; color: #475569; font-size: 13px; font-weight: 600; }

        main { max-width: 820px; margin: 40px auto; padding: 0 20px; }

        .success {
            background: linear-gradient(135deg, #16a085, #1abc9c); color: white; border-radius: 16px;
            padding: 24px; margin-bottom: 24px; display: flex; gap: 16px; align-items: center;
        }
        .success .icon { font-size: 36px; }
        .success h1 { font-size: 22px; margin-bottom: 4px; }
        .success p { font-size: 13px; opacity: .9; }

        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
        .actions button, .actions a {
            border: 1px solid var(--border); background: white; color: var(--blue); border-radius: 8px; padding: 11px 16px;
            font: 700 13px Inter, sans-serif; cursor: pointer; text-decoration: none;
        }
        .actions .primary { background: var(--primary); border-color: var(--primary); color: white; }

        .ticket {
            background: white; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.08);
            margin-bottom: 24px; page-break-inside: avoid;
        }
        .ticket-head {
            background: linear-gradient(110deg, #0b2d4d, #164a73); color: white; padding: 18px 24px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .ticket-head .brand { font-weight: 800; font-size: 20px; }
        .ticket-head .brand span { color: #ff7043; }
        .ticket-head small { display: block; opacity: .8; font-size: 11px; }
        .code { font-family: ui-monospace, Consolas, monospace; font-size: 16px; font-weight: 800; letter-spacing: 1px; }

        .ticket-body { display: grid; grid-template-columns: 1fr 170px; }
        .ticket-main { padding: 22px 24px; border-right: 2px dashed var(--border); }
        .ticket-side { padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
        .qr { width: 130px; height: 130px; display: flex; align-items: center; justify-content: center; }
        .qr img, .qr canvas { width: 130px !important; height: 130px !important; }

        .route { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 20px; }
        .route .city { font-size: 22px; font-weight: 800; color: var(--blue); }
        .route .time { color: var(--muted); font-size: 12px; }
        .route .arrow { color: var(--primary); font-size: 22px; padding: 0 12px; }
        .route > div:last-child { text-align: right; }

        .data { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
        .data small { display: block; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 3px; }
        .data b { color: var(--blue); font-size: 13px; }

        .badge { display: inline-block; padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; }
        .badge.Vigente { background: #eafaf5; color: var(--green); }
        .badge.Utilizado { background: #f1f5f9; color: #64748b; }
        .badge.Anulado { background: #ffecec; color: var(--primary); }

        .foot { padding: 12px 24px; background: #f8fafc; color: var(--muted); font-size: 11px; border-top: 1px solid var(--border); }

        .empty { background: white; border-radius: 16px; padding: 40px; text-align: center; color: var(--muted); }

        @media (max-width: 640px) {
            .ticket-body { grid-template-columns: 1fr; }
            .ticket-main { border-right: 0; border-bottom: 2px dashed var(--border); }
            .data { grid-template-columns: 1fr 1fr; }
            nav { display: none; }
        }

        @media print {
            header, .actions, .success { display: none !important; }
            body { background: white; }
            main { margin: 0; max-width: none; }
            .ticket { box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html" class="logo">🚌 Bus<span>Glow</span></a>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="perfil.html#viajes">Mis viajes</a>
        </nav>
    </header>

    <main>
        <div id="success"></div>
        <div class="actions" id="actions"></div>
        <div id="tickets"><div class="empty">Cargando boletos...</div></div>
    </main>

    <script src="js/api.js"></script>
    <script>
        const { api, fmt, esc, params, requireLogin } = BusGlow;
        requireLogin();

        const idReserva = parseInt(params.get("reserva"), 10);

        async function cargar() {
            let boletos;
            try {
                boletos = await api(`/reservas/${idReserva}/boletos`);
            } catch (err) {
                document.getElementById("tickets").innerHTML = `<div class="empty">${esc(err.message)}</div>`;
                return;
            }
            if (!boletos.length) {
                document.getElementById("tickets").innerHTML =
                    `<div class="empty">Esta reserva aún no tiene boletos emitidos. <a href="pago.html?reserva=${idReserva}">Completar pago</a></div>`;
                return;
            }

            if (params.get("nuevo")) {
                document.getElementById("success").innerHTML = `
                    <div class="success">
                        <div class="icon">✅</div>
                        <div>
                            <h1>¡Compra confirmada!</h1>
                            <p>Emitimos ${boletos.length} boleto${boletos.length > 1 ? "s" : ""} electrónico${boletos.length > 1 ? "s" : ""}.
                               Preséntalo en el terminal junto con tu DNI 30 minutos antes de la salida.</p>
                        </div>
                    </div>`;
            }

            let regreso = null;
            try { regreso = JSON.parse(sessionStorage.getItem("busglow_regreso")); } catch { /* nada */ }
            const b0 = boletos[0];
            const botonRegreso = regreso && regreso.origen === b0.destino
                ? `<a class="primary" href="resultados.html?${new URLSearchParams(regreso)}" onclick="sessionStorage.removeItem('busglow_regreso')">↩️ Elegir viaje de regreso (${fmt.fecha(regreso.fecha)})</a>`
                : "";

            document.getElementById("actions").innerHTML = `
                ${botonRegreso}
                <button onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
                <a href="perfil.html#viajes">🚌 Ver mis viajes</a>`;

            document.getElementById("tickets").innerHTML = boletos.map((b, i) => `
                <article class="ticket">
                    <div class="ticket-head">
                        <div>
                            <div class="brand">Bus<span>Glow</span></div>
                            <small>Boleto electrónico de viaje</small>
                        </div>
                        <div style="text-align:right">
                            <small>Código de boleto</small>
                            <div class="code">${esc(b.codigo_boleto)}</div>
                        </div>
                    </div>
                    <div class="ticket-body">
                        <div class="ticket-main">
                            <div class="route">
                                <div><div class="city">${esc(b.origen)}</div><div class="time">${fmt.fecha(b.fecha_salida)} · ${b.hora_salida}</div></div>
                                <div class="arrow">→</div>
                                <div><div class="city">${esc(b.destino)}</div><div class="time">${fmt.fecha(b.fecha_llegada)} · ${b.hora_llegada}</div></div>
                            </div>
                            <div class="data">
                                <div><small>Pasajero</small><b>${esc(b.nombres)} ${esc(b.apellidos)}</b></div>
                                <div><small>DNI</small><b>${esc(b.dni)}</b></div>
                                <div><small>Asiento</small><b>${esc(b.asiento)}${b.piso > 1 ? ` (piso ${b.piso})` : ""}</b></div>
                                <div><small>Empresa</small><b>${esc(b.empresa)}</b></div>
                                <div><small>Servicio</small><b>${esc(b.tipo_servicio)}</b></div>
                                <div><small>Bus</small><b>${esc(b.placa)}</b></div>
                                <div><small>Terminal de embarque</small><b>${esc(b.terminal_origen || "-")}</b></div>
                                <div><small>Precio</small><b>${fmt.money(b.precio)}</b></div>
                                <div><small>Estado</small><span class="badge ${esc(b.estado)}">${esc(b.estado)}</span></div>
                            </div>
                        </div>
                        <div class="ticket-side">
                            <div class="qr" id="qr${i}"></div>
                            <small style="color:#718096;font-size:10px">Reserva #${b.id_reserva}<br>Emitido ${esc(b.fecha_emision)}</small>
                        </div>
                    </div>
                    <div class="foot">${esc(b.terminal_origen_direccion || "")} · Estado del viaje: ${esc(b.estado_viaje)} · RUC ${esc(b.ruc)}</div>
                </article>`).join("");

            // Código QR con el código del boleto (si la librería cargó)
            const dibujarQR = () => boletos.forEach((b, i) => {
                const el = document.getElementById(`qr${i}`);
                if (window.QRCode) new QRCode(el, { text: b.codigo_boleto, width: 130, height: 130, correctLevel: QRCode.CorrectLevel.M });
                else el.innerHTML = `<div class="code" style="color:#0b2d4d">${esc(b.codigo_boleto)}</div>`;
            });
            if (document.readyState === "complete") dibujarQR(); else window.addEventListener("load", dibujarQR);
        }

        cargar();
    </script>

</body>
</html>
