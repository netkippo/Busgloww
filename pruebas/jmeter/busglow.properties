# =====================================================================
#  BusGlow - Configuración de la prueba de rendimiento (JMeter)
#  Cambia aquí la carga sin abrir el .jmx. También puedes sobrescribir
#  cualquier valor al ejecutar:  -Jusuarios_lectura=100
# =====================================================================

# --- Servidor -------------------------------------------------------
host=localhost
port=3000
protocolo=http

# --- 1. Búsqueda y asientos (solo lectura) --------------------------
usuarios_lectura=50
# segundos para que entren todos los usuarios
rampa_lectura=30
# segundos que dura el escenario
duracion_lectura=180

# --- 2. Compra completa (escribe en la base) ------------------------
usuarios_compra=20
rampa_compra=20
duracion_compra=180

# --- 3. Doble venta simultánea (todos al mismo asiento) -------------
usuarios_carrera=30
rampa_carrera=5
# viaje que se disputa: ruta y días desde hoy
carrera_origen=Lima
carrera_destino=Cusco
carrera_dias=25

# --- 4. Panel de administración -------------------------------------
usuarios_admin=5
rampa_admin=5
duracion_admin=120
admin_correo=admin@busglow.pe
admin_password=Admin123!

# --- Comportamiento del usuario -------------------------------------
# pausa entre acciones: entre pausa_min_ms y pausa_min_ms + pausa_rango_ms
pausa_min_ms=1000
pausa_rango_ms=2000
# las búsquedas eligen una fecha al azar entre mañana y estos días
dias_busqueda=20

# --- Informe HTML ---------------------------------------------------
# APDEX: satisfecho hasta 1,5 s; tolerable hasta 3 s (RNF de rendimiento)
jmeter.reportgenerator.apdex_satisfied_threshold=1500
jmeter.reportgenerator.apdex_tolerated_threshold=3000
jmeter.reportgenerator.report_title=BusGlow - Prueba de rendimiento
jmeter.reportgenerator.overall_granularity=5000
