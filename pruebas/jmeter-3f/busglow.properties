# =====================================================================
#  BusGlow - Prueba de 3 funcionalidades (JMeter)
#  F1 Inicio de sesión · F2 Búsqueda de viajes · F3 Compra de pasaje
#  Las tres corren al mismo tiempo (carga mixta, como en la vida real).
# =====================================================================
host=localhost
port=3000
protocolo=http

# Usuarios simultáneos de cada funcionalidad
usuarios_login=10
usuarios_busqueda=40
usuarios_compra=10

# Segundos para que entren todos los usuarios y duración total
rampa=60
duracion=300

# Pausa del usuario entre acciones: entre 1 y 3 segundos
pausa_min_ms=1000
pausa_rango_ms=2000
dias_busqueda=20

# Usuario para la prueba de inicio de sesión
login_correo=juan.perez@email.com
login_password=Cliente123

# --- Informe HTML con gráficos ---------------------------------------
# APDEX: satisfecho hasta 1,5 s; tolerable hasta 3 s (RNF de rendimiento)
jmeter.reportgenerator.apdex_satisfied_threshold=1500
jmeter.reportgenerator.apdex_tolerated_threshold=3000
jmeter.reportgenerator.report_title=BusGlow - Login, búsqueda y compra
jmeter.reportgenerator.overall_granularity=5000
# Solo las 3 funcionalidades (transacciones) en los gráficos del informe
jmeter.reportgenerator.exporter.html.series_filter=^F[123] .*
